services:
  postgres:
    image: postgres:16-alpine
    container_name: hirehub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hirehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirehub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hirehub}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - hirehub_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hirehub} -d ${POSTGRES_DB:-hirehub}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hirehub_pgdata:
    name: hirehub_pgdata
